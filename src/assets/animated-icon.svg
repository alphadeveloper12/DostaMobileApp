  <style>
    .sketch {
      stroke: #054A86;
      stroke-width: 1.5;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: sketch-anim 2s infinite ease-in-out;
      fill: transparent;
    }
