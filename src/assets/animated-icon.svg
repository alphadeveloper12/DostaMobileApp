        opacity: 1;
      }
      55% {
        fill: #054A86;
        opacity: 1;
      }
      85% {
        fill: #054A86;
        stroke-dashoffset: 0;
        opacity: 1;
      }
      100% {
        fill: transparent;
        stroke-dashoffset: 0;
        opacity: 0;
      }
    }
  </style>
